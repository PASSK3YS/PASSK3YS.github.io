layout: default
title: Cinema Watchlist
permalink: /cinema-watchlist/
---

<style>
.page-header {
    text-align: center;
    margin-bottom: 30px;
}
.main-title {
    font-size: 2.5em;
    color: var(--text);
    margin: 0 0 10px 0;
}
.year-subtitle {
    font-size: 1.8em;
    margin: 0;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border);
    display: inline-block;
}
.year-nav {
    display: flex;
    gap: 15px;
    justify-content: center;
}
.year-nav a {
    text-decoration: none;
    border-bottom: none !important;
}
.year-inactive {
    color: var(--text-muted);
    transition: color 0.2s ease;
}
.year-inactive:hover {
    color: var(--text);
}
.year-active {
    color: var(--accent);
    font-weight: bold;
}
.watch-count {
    display: block;
    margin-top: 15px;
    font-size: 0.9rem;
    font-weight: bold;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 2px;
}
.movie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto;
}
.movie-card {
    display: flex;
    align-items: center;
    background-color: var(--nav-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 15px;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
}
.movie-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    border-color: var(--accent);
}
.movie-thumbnail {
    width: 100px;
    height: 150px;
    object-fit: cover;
    background-color: var(--bg);
    flex-shrink: 0;
    border-radius: 8px;
    margin-right: 20px;
    border: 1px solid var(--border);
}
.movie-info {
    display: flex;
    flex-direction: column;
    text-align: left;
}
.movie-title {
    font-size: 1.1rem;
    font-weight: bold;
    margin: 0 0 5px 0;
    color: var(--text);
    line-height: 1.3;
}
.movie-date {
    font-size: 0.85rem;
    color: var(--accent);
    font-weight: bold;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
</style>

<div class="page-header">
    <h1 class="main-title">Cinema Watchlist</h1>

        <a href="#" class="year-active">2026</a>
    </h2>
    <span class="watch-count" id="totalCount"></span>
</div>

        <div class="movie-info">

        <div class="movie-info">

    const movieCards = document.querySelectorAll('.movie-card');

</script>
