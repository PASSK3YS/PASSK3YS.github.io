<style>
.page-header {
    text-align: center;
    margin-bottom: 40px;
}
.main-title {
    font-size: 2.5em;
    color: var(--text);
    margin: 0 0 10px 0;
}
.year-nav {
    display: flex;
    gap: 15px;
    justify-content: center;
    align-items: center;
}
.year-nav a {
    text-decoration: none;
    border-bottom: none !important;
    padding: 6px 18px;
    border-radius: 25px;
    transition: all 0.3s ease;
}
.year-inactive {
    color: var(--text-muted);
    opacity: 0.5;
}
.year-inactive:hover {
    color: var(--text);
    opacity: 1;
    background-color: var(--nav-bg);
}
.year-active {
    color: var(--accent);
    font-weight: bold;
    background-color: var(--border);
    box-shadow: 0 0 10px var(--accent-glow);
}
.watch-count {
    font-size: 0.9rem;
    font-weight: bold;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 2px;
}
.controls-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-top: 15px;
}
.sort-btn {
    background-color: var(--nav-bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 16px;
    border-radius: 20px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.sort-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
}
.movie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto;
}
.movie-card {
    display: flex;
    align-items: center;
    background-color: var(--nav-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 15px;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
}
.movie-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    border-color: var(--accent);
}
.movie-thumbnail {
    width: 100px;
    height: 150px;
    object-fit: cover;
    background-color: var(--bg);
    flex-shrink: 0;
    border-radius: 8px;
    margin-right: 20px;
    border: 1px solid var(--border);
}
.movie-info {
    display: flex;
    flex-direction: column;
    text-align: left;
}
.movie-title {
    font-size: 1.1rem;
    font-weight: bold;
    margin: 0 0 5px 0;
    color: var(--text);
    line-height: 1.3;
}
.movie-date {
    font-size: 0.85rem;
    color: var(--accent);
    font-weight: bold;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
</style>

<div class="page-header">

</div>

</div>

<script>
    const movieCards = document.querySelectorAll('.movie-card');
    const totalCountDisplay = document.getElementById('totalCount');
    totalCountDisplay.textContent = `Total Watched: ${movieCards.length}`;

    const sortToggle = document.getElementById('sortToggle');
    const movieGrid = document.getElementById('movieGrid');
    let isNewestFirst = true;

    sortToggle.addEventListener('click', function() {
        isNewestFirst = !isNewestFirst;
        sortToggle.textContent = isNewestFirst ? '⬇️ Newest First' : '⬆️ Oldest First';

        const cardsArray = Array.from(movieCards);

        cardsArray.sort(function(a, b) {
            const dateA = new Date(a.querySelector('.movie-date').textContent + ' 2026');
            const dateB = new Date(b.querySelector('.movie-date').textContent + ' 2026');

            if (isNewestFirst) {
                return dateB - dateA;
            } else {
                return dateA - dateB;
            }
        });

        cardsArray.forEach(function(card) {
            movieGrid.appendChild(card);
        });
    });
</script>
