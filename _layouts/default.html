<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | kieran.colfer.net</title>
    
    <script>
        const savedTheme = localStorage.getItem('theme') || 'system';
        let systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        
        if (savedTheme === 'system') {
            document.documentElement.setAttribute('data-theme', systemTheme);
        } else {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
    </script>

    {% if page.description %}
    <meta name="description" content="{{ page.description }}">
    <meta property="og:description" content="{{ page.description }}">
    {% endif %}

    {% if page.image %}
    <meta property="og:image" content="{{ page.image }}">
    {% endif %}

    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:url" content="https://kieran.colfer.net{{ page.url }}">
    <meta name="twitter:card" content="summary_large_image">

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

    <header>
        <nav>
            <a href="/">About</a>
            <a href="/standard-notes-themes/">Standard Notes Themes</a>
            <a href="/my-recommendations/">Recommendations</a>
            <a href="/docs/">Docs</a>
            <a href="/blog/">Blog</a>

            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Theme">
                <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg id="system-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            </button>
        </nav>
    </header>

    <main>
        {{ content }}

{% if page.collection == 'docs' %}
        <div class="docs-metadata" style="margin-top: 40px; border-top: 1px solid var(--border-color); padding-top: 20px; display: flex; flex-direction: column; gap: 12px;">
            
            <style>
                .docs-meta-link {
                    text-decoration: none;
                    display: inline-flex;
                    align-items: center;
                    font-size: 0.9em;
                    opacity: 0.7;
                    transition: opacity 0.2s ease;
                }
                .docs-meta-link:hover {
                    opacity: 1;
                }
                .contributor-avatar {
                    width: 32px;
                    height: 32px;
                    border-radius: 50%;
                    border: 2px solid var(--bg-color);
                    box-shadow: 0 0 0 1px var(--border-color);
                    transition: transform 0.2s ease, box-shadow 0.2s ease;
                }
                .contributor-avatar:hover {
                    transform: translateY(-2px);
                    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
                    z-index: 10;
                }
                .meta-label {
                    font-size: 0.75em;
                    text-transform: uppercase;
                    letter-spacing: 0.05em;
                    opacity: 0.5;
                    font-weight: 600;
                    margin-right: 8px;
                }
            </style>

            <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center;">
                <a href="https://github.com/PASSK3YS/PASSK3YS.github.io/edit/main/{{ page.path }}" target="_blank" class="docs-meta-link">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    Edit this page
                </a>

                <a href="https://buymeacoffee.com/passkeys" target="_blank" class="docs-meta-link">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="margin-right: 6px;"><path d="M19,10.01C19.82,10.01 20.61,10.23 21.31,10.63C22.31,11.22 23,12.28 23,13.5C23,14.73 22.31,15.78 21.31,16.37C20.61,16.77 19.82,17 19,17H18V18.5C18,20.43 16.43,22 14.5,22H6.5C4.57,22 3,20.43 3,18.5V4C3,2.9 3.9,2 5,2H16C17.1,2 18,2.9 18,4V10.01H19M16,18.5V4H5V18.5C5,19.33 5.67,20 6.5,20H14.5C15.33,20 16,19.33 16,18.5M19,15C19.55,15 20,14.55 20,14C20,13.45 19.55,13 19,13H18V15H19Z"/></svg>
                    Buy me a beer
                </a>
                
                <span id="last-edited" class="docs-meta-link" style="cursor: default;"></span>
            </div>

            <div id="contributors" style="display: none; align-items: center; min-height: 32px;">
                <span class="meta-label">Contributors</span>
            </div>

            <script>
                (function() {
                    const filePath = "{{ page.path }}";
                    const repo = "PASSK3YS/PASSK3YS.github.io";
                    const apiUrl = `https://api.github.com/repos/${repo}/commits?path=${filePath}`;

                    fetch(apiUrl)
                        .then(response => response.json())
                        .then(data => {
                            if (data && data.length > 0) {
                                const date = new Date(data[0].commit.committer.date);
                                const formattedDate = date.toLocaleDateString('en-GB', { 
                                    day: 'numeric', month: 'long', year: 'numeric' 
                                });
                                document.getElementById('last-edited').textContent = "• Last edited: " + formattedDate;

                                const contributorsDiv = document.getElementById('contributors');
                                const uniqueAuthors = new Map();

                                data.forEach(commit => {
                                    if (commit.author && !uniqueAuthors.has(commit.author.login)) {
                                        uniqueAuthors.set(commit.author.login, {
                                            avatar: commit.author.avatar_url,
                                            url: commit.author.html_url,
                                            name: commit.author.login
                                        });
                                    }
                                });

                                if (uniqueAuthors.size > 0) {
                                    contributorsDiv.style.display = 'flex';
                                    uniqueAuthors.forEach(author => {
                                        const link = document.createElement('a');
                                        link.href = author.url;
                                        link.target = "_blank";
                                        link.title = author.name;
                                        link.style.textDecoration = "none";
                                        link.style.marginLeft = "-8px"; 
                                        link.style.position = "relative";
                                        
                                        const img = document.createElement('img');
                                        img.src = author.avatar;
                                        img.className = "contributor-avatar";
                                        
                                        link.appendChild(img);
                                        contributorsDiv.appendChild(link);
                                    });
                                    
                                    if(contributorsDiv.children[1]) {
                                        contributorsDiv.children[1].style.marginLeft = "0";
                                    }
                                }
                            }
                        })
                        .catch(err => console.log(err));
                })();
            </script>
        </div>
        {% endif %}
