<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | kieran.colfer.net</title>
    
    <script>
        const savedTheme = localStorage.getItem('theme') || 'system';
        let systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (savedTheme === 'system') {
            document.documentElement.setAttribute('data-theme', systemTheme);
        } else {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
    </script>

    {% if page.description %}
    <meta name="description" content="{{ page.description }}">
    <meta property="og:description" content="{{ page.description }}">
    {% endif %}

    {% assign og_image = page.image | default: "https://files.horizon.pics/2d6f201f-fbb8-4870-8a67-c8e1357d2fed?a=480&region=eu-central&mime1=image&mime2=jpeg" %}
    <meta property="og:image" content="{{ og_image }}">
    <meta name="twitter:image" content="{{ og_image }}">

    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:url" content="https://kieran.colfer.net{{ page.url }}">
    <meta name="twitter:card" content="summary_large_image">

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
        body, main, h1, h2, h3, p, a, span, div, button { font-family: 'JetBrains Mono', monospace !important; }
        
        main { max-width: 1200px; margin: 0 auto; padding: 0 20px; width: 100%; box-sizing: border-box; }

        .nav-header {
            width: 100%; max-width: 1200px; background: var(--nav-bg);
            border: 1px solid var(--border); border-radius: 8px; padding: 15px 25px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.1); margin-top: 2rem;
        }

        .nav-scroll { display: flex; align-items: center; gap: 5px; overflow-x: auto; scrollbar-width: none; }
        .nav-scroll a {
            display: inline-block; font-weight: 800; background: transparent; 
            border: 1px solid transparent; padding: 8px 16px; border-radius: 4px; color: var(--text);
            text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px;
            transition: all 0.1s ease; text-decoration: none !important;
        }
        .nav-scroll a:hover, .nav-scroll a.active { color: var(--accent); background: var(--accent-glow); border: 1px solid var(--accent); }

        .floating-player-wrapper {
            position: fixed; bottom: 90px; left: 30px; width: 300px;
            background: var(--nav-bg); border: 1px solid var(--border);
            border-radius: 8px; z-index: 1000; box-shadow: 6px 6px 0px rgba(0,0,0,0.1);
            transform: translateY(20px); opacity: 0; visibility: hidden;
            transition: all 0.2s ease;
        }
        .floating-player-wrapper.is-open { opacity: 1; visibility: visible; transform: translateY(0); }
        .ytm-maximized-content { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .ytm-status { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: var(--accent); }
        .ytm-title { font-weight: 800; font-size: 1rem; color: var(--text); }
        .ytm-artist { font-size: 0.85rem; color: var(--text-muted); }

        .floating-music-btn {
            position: fixed; bottom: 30px; left: 30px; width: 50px; height: 50px;
            background: var(--nav-bg); color: var(--accent); border: 1px solid var(--border);
            border-radius: 4px; cursor: pointer; display: flex; justify-content: center; align-items: center;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.1); z-index: 1000;
        }

        .scroll-to-top {
            position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px;
            background: var(--nav-bg); color: var(--accent); border: 1px solid var(--border);
            border-radius: 4px; cursor: pointer; display: flex; justify-content: center; align-items: center;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.1); z-index: 1000;
            opacity: 0; visibility: hidden; transition: all 0.1s ease;
        }
        .scroll-to-top.visible { opacity: 1; visibility: visible; }

        .floating-music-btn:hover, .scroll-to-top:hover {
            transform: translate(-2px, -2px); box-shadow: 6px 6px 0px rgba(12, 230, 242, 0.2);
            background: rgba(12, 230, 242, 0.05); border-color: var(--accent);
        }

        footer { margin-top: 4rem; padding: 2rem; border-top: 1px dashed var(--border); text-align: center; }
        .footer-socials { display: flex; justify-content: center; gap: 20px; margin-bottom: 1rem; }
    </style>
</head>
<body>

    <header>
        <div class="nav-header">
            <div class="nav-scroll">
                <a href="/" {% if page.url == '/' or page.url == '/index.html' %}class="active"{% endif %}>About</a>
                <a href="/contact/" {% if page.url contains '/contact/' %}class="active"{% endif %}>Contact</a>
                <a href="/docs/" {% if page.collection == 'docs' or page.url contains '/docs/' %}class="active"{% endif %}>Docs</a>
                <a href="/tools/" {% if page.url contains '/tools/' %}class="active"{% endif %}>Tools</a>
                <a href="/blog/" {% if page.url contains '/blog/' or page.layout == 'post' %}class="active"{% endif %}>Blog</a>
            </div>
        </div>
    </header>

    <main>
        {{ content }}
    </main>

    <button id="musicToggleBtn" class="floating-music-btn" aria-label="Toggle Music Player">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
    </button>

    <div id="floating-player" class="floating-player-wrapper">
        <div class="ytm-maximized-content">
            <div class="ytm-status" id="ytm-state-text">LOADING...</div>
            <div class="ytm-title" id="ytm-track"></div>
            <div class="ytm-artist" id="ytm-artist"></div>
        </div>
    </div>

    <button id="scrollToTopBtn" class="scroll-to-top" aria-label="Scroll to top">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>

    <footer>
        <div class="footer-socials">
            <a href="https://github.com/PASSK3YS" target="_blank">GitHub</a>
            <a href="https://gitlab.com/m00t" target="_blank">GitLab</a>
        </div>
        <p>© 2026 Kieran Colfer</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const musicBtn = document.getElementById('musicToggleBtn');
            const player = document.getElementById('floating-player');
            musicBtn.addEventListener('click', () => player.classList.toggle('is-open'));

            const scrollToTopBtn = document.getElementById('scrollToTopBtn');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) scrollToTopBtn.classList.add('visible');
                else scrollToTopBtn.classList.remove('visible');
            });
            scrollToTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

            const workerUrl = 'https://xbox-tracker.snowy-scene-5750.workers.dev';
            function fetchMusic() {
                fetch(workerUrl).then(res => res.json()).then(data => {
                    if (data.music) {
                        document.getElementById('ytm-track').textContent = data.music.title;
                        document.getElementById('ytm-artist').textContent = data.music.artist;
                        document.getElementById('ytm-state-text').textContent = data.music.isPlaying ? "LIVE" : "LAST PLAYED";
                    }
                }).catch(() => {});
            }
            fetchMusic();
            setInterval(fetchMusic, 5000);
        });
    </script>
</body>
</html>
