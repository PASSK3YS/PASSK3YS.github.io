            <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center;">
                <a href="https://github.com/PASSK3YS/PASSK3YS.github.io/edit/main/{{ page.path }}" target="_blank" style="text-decoration: none; display: inline-flex; align-items: center;">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    Edit this page on GitHub
                </a>

                <a href="https://buymeacoffee.com/passkeys" target="_blank" style="text-decoration: none; display: inline-flex; align-items: center;">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="margin-right: 6px;"><path d="M19,10.01C19.82,10.01 20.61,10.23 21.31,10.63C22.31,11.22 23,12.28 23,13.5C23,14.73 22.31,15.78 21.31,16.37C20.61,16.77 19.82,17 19,17H18V18.5C18,20.43 16.43,22 14.5,22H6.5C4.57,22 3,20.43 3,18.5V4C3,2.9 3.9,2 5,2H16C17.1,2 18,2.9 18,4V10.01H19M16,18.5V4H5V18.5C5,19.33 5.67,20 6.5,20H14.5C15.33,20 16,19.33 16,18.5M19,15C19.55,15 20,14.55 20,14C20,13.45 19.55,13 19,13H18V15H19Z"/></svg>
                    Buy me a beer
                </a>
                
                <span id="last-edited" style="opacity: 0.8;"></span>
            </div>

            <div id="contributors" style="display: none; align-items: center; gap: 8px; min-height: 30px;">
                <span style="opacity: 0.8; margin-right: 5px;">Contributors:</span>
            </div>

            <script>
                (function() {
                    const filePath = "{{ page.path }}";
                    const repo = "PASSK3YS/PASSK3YS.github.io";
                    const apiUrl = `https://api.github.com/repos/${repo}/commits?path=${filePath}`;

                    fetch(apiUrl)
                        .then(response => response.json())
                        .then(data => {
                            if (data && data.length > 0) {
                                const date = new Date(data[0].commit.committer.date);
                                const formattedDate = date.toLocaleDateString('en-GB', { 
                                    day: 'numeric', month: 'long', year: 'numeric' 
                                });
                                document.getElementById('last-edited').textContent = "• Last edited: " + formattedDate;

                                const contributorsDiv = document.getElementById('contributors');
                                const uniqueAuthors = new Map();

                                data.forEach(commit => {
                                    if (commit.author && !uniqueAuthors.has(commit.author.login)) {
                                        uniqueAuthors.set(commit.author.login, {
                                            avatar: commit.author.avatar_url,
                                            url: commit.author.html_url,
                                            name: commit.author.login
                                        });
                                    }
                                });

                                if (uniqueAuthors.size > 0) {
                                    contributorsDiv.style.display = 'flex';
                                    uniqueAuthors.forEach(author => {
                                        const link = document.createElement('a');
                                        link.href = author.url;
                                        link.target = "_blank";
                                        link.title = author.name;
                                        link.style.textDecoration = "none";
                                        
                                        const img = document.createElement('img');
                                        img.src = author.avatar;
                                        img.style.width = "30px";
                                        img.style.height = "30px";
                                        img.style.borderRadius = "50%";
                                        img.style.border = "1px solid var(--border-color)";
                                        
                                        link.appendChild(img);
                                        contributorsDiv.appendChild(link);
                                    });
                                }
                            }
                        })
                        .catch(err => console.log(err));
                })();
            </script>
        </div>
