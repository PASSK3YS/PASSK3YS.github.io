<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | kieran.colfer.net</title>
    
    <script>
        const savedTheme = localStorage.getItem('theme') || 'system';
        let systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (savedTheme === 'system') {
            document.documentElement.setAttribute('data-theme', systemTheme);
        } else {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
    </script>

    {% if page.description %}
    <meta name="description" content="{{ page.description }}">
    <meta property="og:description" content="{{ page.description }}">
    {% endif %}

    {% assign og_image = page.image | default: "https://files.horizon.pics/2d6f201f-fbb8-4870-8a67-c8e1357d2fed?a=480&region=eu-central&mime1=image&mime2=jpeg" %}
    <meta property="og:image" content="{{ og_image }}">
    <meta name="twitter:image" content="{{ og_image }}">

    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:url" content="https://kieran.colfer.net{{ page.url }}">
    <meta name="twitter:card" content="summary_large_image">

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
        main { max-width: 1200px; margin: 0 auto; padding: 0 20px; width: 100%; box-sizing: border-box; }

        div.highlight { position: relative; }

        .copy-code-button {
            position: absolute; top: 5px; right: 5px; color: #fff;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px; padding: 5px 10px; font-size: 12px;
            cursor: pointer; opacity: 0; transition: opacity 0.3s ease;
        }

        div.highlight:hover .copy-code-button { opacity: 1; }

        body > header { display: flex; justify-content: center; width: 100%; margin-bottom: 3rem; }

        .nav-header {
            width: 100%; max-width: 1200px; background: var(--nav-bg);
            border: 1px solid var(--border); border-radius: 8px; padding: 15px 25px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] .nav-header { box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.3); }

        .nav-scroll { display: flex; align-items: center; gap: 5px; overflow-x: auto; scrollbar-width: none; }
        .nav-scroll a {
            display: inline-block; font-weight: 800; background: transparent; 
            border: 1px solid transparent; padding: 8px 16px; border-radius: 4px; color: var(--text);
            text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px;
            transition: all 0.1s ease; text-decoration: none !important;
        }

        .nav-scroll a:hover, .nav-scroll a.active {
            color: var(--accent); background: var(--accent-glow); border: 1px solid var(--accent);
        }

        .theme-toggle {
            position: absolute; right: 25px; background: transparent;
            border: 1px solid transparent; color: var(--text); cursor: pointer;
            padding: 10px; border-radius: 4px; transition: all 0.1s ease;
        }

        .theme-toggle:hover { background: var(--accent-glow); color: var(--accent); border: 1px solid var(--accent); }

        .floating-player-wrapper {
            position: fixed; bottom: 90px; left: 30px; width: 300px;
            background: var(--nav-bg); border: 1px solid var(--border);
            border-radius: 8px; z-index: 1000; box-shadow: 6px 6px 0px rgba(0,0,0,0.1);
            transform: translateY(20px); opacity: 0; visibility: hidden;
            transition: all 0.2s ease; display: none;
        }

        [data-theme="dark"] .floating-player-wrapper { box-shadow: 6px 6px 0px rgba(0,0,0,0.3); }
        .floating-player-wrapper.is-open { opacity: 1; visibility: visible; transform: translateY(0); }
        .floating-player-wrapper.ytm-active { display: block; }

        .ytm-maximized-content { padding: 20px; display: flex; flex-direction: column; gap: 15px; }

        .ytm-link-wrapper { display: flex; flex-direction: column; align-items: center; text-decoration: none !important; width: 100%; gap: 15px; }

        .ytm-art { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; box-shadow: 4px 4px 0px rgba(0,0,0,0.2); }

        .ytm-info { display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; }

        .ytm-status { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 4px; }

        .ytm-title { font-weight: 800; font-size: 1.1rem; color: var(--text); line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 2px; }

        .ytm-artist { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }

        .floating-music-btn, .scroll-to-top {
            position: fixed; bottom: 30px; width: 50px; height: 50px;
            background-color: var(--nav-bg); color: var(--accent);
            border: 1px solid var(--border); border-radius: 4px; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.1); transition: all 0.1s ease; z-index: 1000;
        }

        .floating-music-btn { left: 30px; }
        .scroll-to-top { right: 30px; opacity: 0; visibility: hidden; }

        [data-theme="dark"] .floating-music-btn, [data-theme="dark"] .scroll-to-top { box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.3); }

        .floating-music-btn:hover, .scroll-to-top:hover {
            transform: translate(-2px, -2px); box-shadow: 6px 6px 0px rgba(12, 230, 242, 0.2);
            background-color: rgba(12, 230, 242, 0.05); border-color: var(--accent);
        }

        .scroll-to-top.visible { opacity: 1; visibility: visible; transform: translateY(0); }

        @media (max-width: 768px) {
            .nav-section { justify-content: space-between; }
            .nav-scroll { margin: 0; max-width: calc(100% - 45px); }
            .theme-toggle { position: relative; right: auto; }
            .scroll-to-top { bottom: 20px; right: 20px; width: 45px; height: 45px; }
            .floating-music-btn { bottom: 20px; left: 20px; width: 45px; height: 45px; }
            .floating-player-wrapper { left: 20px; width: calc(100% - 40px); }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-header">
            <div class="nav-scroll">
                <a href="/" {% if page.url == '/' or page.url == '/index.html' %}class="active"{% endif %}>About</a>
                <a href="/contact/" {% if page.url contains '/contact/' %}class="active"{% endif %}>Contact</a>
                <a href="/docs/" {% if page.collection == 'docs' or page.url contains '/docs/' %}class="active"{% endif %}>Docs</a>
                <a href="/tools/" {% if page.url contains '/tools/' %}class="active"{% endif %}>Tools</a>
                <a href="/blog/" {% if page.url contains '/blog/' or page.layout == 'post' %}class="active"{% endif %}>Blog</a>
            </div>
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Theme">
                <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg id="system-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            </button>
        </div>
    </header>

    <main>
        {{ content }}
    </main>

    <button id="musicToggleBtn" class="floating-music-btn" aria-label="Toggle Music Player">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
    </button>

    <div id="floating-player" class="floating-player-wrapper">
        <div class="ytm-maximized-content">
            <a href="" id="ytm-link" target="_blank" class="ytm-link-wrapper">
                <img id="ytm-art" class="ytm-art" src="" alt="">
                <div class="ytm-info">
                    <div class="ytm-status" id="ytm-state-text">Loading...</div>
                    <div class="ytm-title" id="ytm-track"></div>
                    <div class="ytm-artist" id="ytm-artist"></div>
                </div>
            </a>
        </div>
    </div>

    <button id="scrollToTopBtn" class="scroll-to-top" aria-label="Scroll to top">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>

    <script>
        const toggleButton = document.getElementById('theme-toggle');
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');
        const systemIcon = document.getElementById('system-icon');

        function updateIcons(theme) {
            sunIcon.style.display = 'none'; moonIcon.style.display = 'none'; systemIcon.style.display = 'none';
            if (theme === 'light') { sunIcon.style.display = 'block'; } 
            else if (theme === 'dark') { moonIcon.style.display = 'block'; } 
            else { systemIcon.style.display = 'block'; }
        }

        function setTheme(theme) {
            if (theme === 'system') {
                localStorage.setItem('theme', 'system');
                const systemPrefers = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', systemPrefers);
            } else {
                localStorage.setItem('theme', theme);
                document.documentElement.setAttribute('data-theme', theme);
            }
            updateIcons(theme);
        }

        let currentStoredTheme = localStorage.getItem('theme') || 'system';
        updateIcons(currentStoredTheme);

        toggleButton.addEventListener('click', () => {
            let nextTheme;
            const current = localStorage.getItem('theme') || 'system';
            if (current === 'light') { nextTheme = 'dark'; } 
            else if (current === 'dark') { nextTheme = 'system'; } 
            else { nextTheme = 'light'; }
            setTheme(nextTheme);
        });

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if ((localStorage.getItem('theme') || 'system') === 'system') {
                document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
            }
        });

        document.addEventListener("DOMContentLoaded", function() {
            const codeBlocks = document.querySelectorAll('div.highlight');
            codeBlocks.forEach(function(block) {
                const button = document.createElement('button');
                button.className = 'copy-code-button'; button.type = 'button'; button.innerText = 'Copy';
                button.addEventListener('click', function() {
                    const code = block.querySelector('code').innerText;
                    navigator.clipboard.writeText(code).then(function() {
                        button.innerText = 'Copied!';
                        setTimeout(function() { button.innerText = 'Copy'; }, 2000);
                    });
                });
                block.appendChild(button);
            });

            const navScroll = document.querySelector('.nav-scroll');
            const activeLink = navScroll ? navScroll.querySelector('a.active') : null;
            if (navScroll && activeLink) {
                navScroll.scrollLeft = activeLink.offsetLeft - (navScroll.clientWidth / 2) + (activeLink.clientWidth / 2);
            }

            const scrollToTopBtn = document.getElementById('scrollToTopBtn');
            window.addEventListener('scroll', function() {
                if (window.scrollY > 300) { scrollToTopBtn.classList.add('visible'); } 
                else { scrollToTopBtn.classList.remove('visible'); }
            });
            scrollToTopBtn.addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });
        });

        const workerUrl = 'https://xbox-tracker.snowy-scene-5750.workers.dev';
        let currentYtmState = '';

        function fetchNavData() {
            fetch(workerUrl)
                .then(res => res.json())
                .then(async data => {
                    if (data.music && typeof data.music === 'object') {
                        const playerContainer = document.getElementById('floating-player');
                        const art = document.getElementById('ytm-art');
                        const link = document.getElementById('ytm-link');
                        const track = document.getElementById('ytm-track');
                        const artist = document.getElementById('ytm-artist');
                        const stateText = document.getElementById('ytm-state-text');
                        const newState = `${data.music.title}-${data.music.isPlaying}`;
                        
                        if (currentYtmState !== newState) {
                            currentYtmState = newState;
                            let imageUrl = data.music.image;
                            art.src = imageUrl;
                            track.textContent = data.music.title;
                            artist.textContent = data.music.artist;
                            link.href = `https://music.youtube.com/search?q=${encodeURIComponent(data.music.title + ' ' + data.music.artist)}`;
                            stateText.textContent = data.music.isPlaying ? "LIVE" : "LAST PLAYED";
                            playerContainer.classList.add('ytm-active');
                        }
                    }
                })
                .catch(err => {});
        }

        document.addEventListener("DOMContentLoaded", () => {
            const musicBtn = document.getElementById('musicToggleBtn');
            const player = document.getElementById('floating-player');
            musicBtn.addEventListener('click', () => { player.classList.toggle('is-open'); });
            fetchNavData();
            setInterval(fetchNavData, 5000);
        });
    </script>
</body>
</html>
