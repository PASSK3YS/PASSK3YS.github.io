<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | kieran.colfer.net</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <style>
        :root {
            --bg-base: #002b36;
            --bg-surface: #073642;
            --text-main: #93a1a1;
            --text-heading: #eee8d5;
            --text-muted: #586e75;
            --accent-cyan: #2aa198;
            --accent-blue: #268bd2;
            --accent-magenta: #d33682;
            --border-color: rgba(42, 161, 152, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            line-height: 1.7;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background-color: rgba(7, 54, 66, 0.85);
            border-bottom: 1px solid var(--border-color);
            padding: 1.2rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .logo {
            color: var(--text-heading);
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--accent-cyan);
        }

        nav {
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s ease, transform 0.2s ease;
            text-transform: lowercase;
            letter-spacing: 0.5px;
        }

        nav a:hover, nav a.active {
            color: var(--accent-cyan);
        }

        main {
            flex: 1;
            max-width: 1000px;
            margin: 4rem auto;
            padding: 0 2rem;
            width: 100%;
            box-sizing: border-box;
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--text-heading);
            font-weight: 700;
            margin-top: 0;
        }

        h1 {
            font-size: 3rem;
            line-height: 1.1;
            letter-spacing: -1px;
            margin-bottom: 1.5rem;
        }

        a {
            color: var(--accent-blue);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--accent-cyan);
        }

        .card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            border-color: var(--accent-cyan);
        }

        footer {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            background-color: var(--bg-surface);
        }

        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 1.5rem;
            }
            
            nav {
                gap: 1.5rem;
                flex-wrap: wrap;
                justify-content: center;
            }

            h1 {
                font-size: 2.2rem;
            }

            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="/" class="logo">kieran<span>.</span>net</a>
            <nav>
                <a href="/about" {% if page.url contains '/about' %}class="active"{% endif %}>about</a>
                <a href="/blog" {% if page.url contains '/blog' %}class="active"{% endif %}>blog</a>
                <a href="/docs" {% if page.url contains '/docs' %}class="active"{% endif %}>docs</a>
                <a href="/tools" {% if page.url contains '/tools' %}class="active"{% endif %}>tools</a>
                <a href="/cinema-watchlist/2026/" {% if page.url contains '/cinema-watchlist/' %}class="active"{% endif %}>watchlist</a>
            </nav>
        </div>
    </header>

    <main>
        {{ content }}
    </main>

    <footer>
        <p>© 2026 Kieran Colfer</p>
    </footer>

</body>
</html>
