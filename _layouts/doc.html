---
layout: default
---

<style>

.doc-page-wrapper, .doc-page-wrapper p, .doc-page-wrapper a, .doc-page-wrapper span, .doc-page-wrapper div {
    font-family: 'SUSE', sans-serif !important;
}
.doc-page-wrapper pre, .doc-page-wrapper code {
    font-family: 'JetBrains Mono', monospace !important;
}

.doc-back {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.78rem;
    letter-spacing: 0.5px;
    transition: color 0.2s ease, text-shadow 0.2s ease;
}
.doc-back:hover {
    color: var(--accent);
    text-shadow: 0 0 12px var(--accent-glow);
}
.doc-h1 {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    margin-top: 0;
    font-size: 1.15rem;
    color: var(--text);
}

.doc-contrib-card {
    background: var(--nav-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: 'JetBrains Mono', monospace;
}
.doc-contrib-row {
    padding: 14px 18px;
    align-items: center;
    transition: background-color 0.2s ease;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.78rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}
a.doc-contrib-row:hover {
    background-color: var(--accent-glow);
    color: var(--accent);
}
.doc-gh-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.5px;
    transition: transform 0.25s ease;
}
a.doc-contrib-row:hover .doc-gh-meta {
    transform: translateX(4px);
}
.doc-contrib-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin: 0;
    font-weight: 700;
}
.avatar-stack {
    display: flex;
    align-items: center;
}
.avatar-stack img {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--nav-bg);
    margin-left: -10px;
    transition: transform 0.3s ease, border-color 0.3s ease;
    background: var(--bg-solid);
}
.avatar-stack a:first-child img {
    margin-left: 0;
}
.avatar-stack a:hover img {
    transform: translateY(-4px);
    z-index: 10;
    position: relative;
    border-color: var(--accent);
}

@keyframes blink-cursor {
    50% { opacity: 0; }
}
</style>

<article class="post doc-page-wrapper">
  <div class="page-content">
    
    <p style="margin-bottom: 25px;">
        <a href="/docs/" class="doc-back">
            &lt;&lt; cd /docs/
        </a>
    </p>

    <header class="post-header">
      <div style="display: flex; gap: 10px; align-items: baseline; font-family: 'JetBrains Mono', monospace; margin-bottom: 24px;">
        <span style="color: var(--accent);">$</span>
        <h1 class="post-title doc-h1" style="margin: 0;">cat {{ page.title }}.md<span style="color: var(--accent); animation: blink-cursor 1s step-end infinite;">▊</span></h1>
      </div>
    </header>

    <div class="post-content" style="margin-top: 30px;">
      {{ content }}
    </div>

    <div class="doc-contrib-card" style="margin-top: 60px;">
        <a href="https://github.com/PASSK3YS/PASSK3YS.github.io/edit/main/{{ page.path }}" target="_blank" class="doc-contrib-row" style="text-decoration: none;">
            <div class="doc-gh-meta">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.419-1.305.763-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                Edit this page on GitHub
            </div>
            <span id="last-edited-time">Loading history...</span>
        </a>
        
        <div id="contributors-row" class="doc-contrib-row" style="border-top: 1px dashed var(--border);">
            <h3 class="doc-contrib-label" style="margin: 0;">&gt;_ Contributors</h3>
            <div id="contributors-avatars" class="avatar-stack"></div>
        </div>
    </div>

  </div>
</article>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const repo = "PASSK3YS/PASSK3YS.github.io";
    const path = "{{ page.path }}";
    
    fetch(`https://api.github.com/repos/${repo}/commits?path=${path}`)
        .then(res => res.json())
        .then(commits => {
            const timeEl = document.getElementById('last-edited-time');
            const avatarsEl = document.getElementById('contributors-avatars');
            const rowEl = document.getElementById('contributors-row');
            
            if (commits && commits.length > 0) {
                const lastCommitDate = new Date(commits[0].commit.committer.date);
                timeEl.textContent = 'LAST EDITED: ' + lastCommitDate.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
                
                const authors = new Set();
                let avatarHtml = '';
                
                commits.forEach(c => {
                    if (c.author && !authors.has(c.author.login)) {
                        authors.add(c.author.login);
                        avatarHtml += `<a href="${c.author.html_url}" target="_blank" title="${c.author.login}"><img src="${c.author.avatar_url}&s=60" alt="${c.author.login}"></a>`;
                    }
                });
                
                if (avatarHtml !== '') {
                    avatarsEl.innerHTML = avatarHtml;
                } else {
                    rowEl.style.display = 'none';
                }
            } else {
                timeEl.textContent = 'LAST EDITED: UNKNOWN';
                rowEl.style.display = 'none';
            }
        })
        .catch(() => {
            document.getElementById('last-edited-time').textContent = 'LAST EDITED: UNKNOWN';
            document.getElementById('contributors-row').style.display = 'none';
        });
});
</script>
