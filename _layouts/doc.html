---
layout: default
---

<article class="post">
  <div class="page-content">
    
    <p style="margin-bottom: 20px;">
        <a href="/docs/" style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; text-decoration: none; border-bottom: none;">
            &larr; Back to Docs
        </a>
    </p>

    <header class="post-header">
      <h1 class="post-title" style="margin-top: 0;">{{ page.title }}</h1>
    </header>

    <div class="post-content" style="margin-top: 30px;">
      {{ content }}
    </div>

  </div>
</article>
