---
layout: default
---

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">

<style>
.doc-page-wrapper {
    font-family: 'JetBrains Mono', monospace !important;
}
.back-link-hacker {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    transition: color 0.1s ease;
}
.back-link-hacker:hover {
    color: var(--accent-cyan);
}
.doc-h1 {
    font-weight: 800;
    letter-spacing: -1px;
    margin-top: 0;
    font-size: 2.2rem;
}

.unified-card {
    background: var(--nav-bg);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border-color, var(--border));
    box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.1);
    overflow: hidden;
}
[data-theme="dark"] .unified-card {
    border: 1px solid var(--border-color, var(--border));
    box-shadow: 6px 6px 0px rgba(255, 255, 255, 0.1);
}
.unified-row {
    padding: 20px 24px;
    align-items: center;
    transition: background-color 0.1s ease, border-color 0.1s ease;
    border-left: 6px solid transparent;
}
.unified-row.interactive-row:hover {
    background-color: rgba(42, 161, 152, 0.05);
    border-left-color: var(--accent-cyan);
}
[data-theme="dark"] .unified-row.interactive-row:hover {
    background-color: rgba(42, 161, 152, 0.1);
    border-left-color: var(--accent-cyan);
}
.soft-header {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin: 0;
    font-weight: 700;
}
.unified-meta {
    font-size: 0.85rem;
    color: var(--accent-cyan);
    margin: 0;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-decoration: none;
    transition: transform 0.1s ease;
}
.unified-meta:hover {
    transform: translateX(4px);
}
.avatar-stack {
    display: flex;
    align-items: center;
}
.avatar-stack img {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--nav-bg);
    margin-left: -10px;
    transition: transform 0.1s ease;
    background: var(--bg);
}
.avatar-stack a:first-child img {
    margin-left: 0;
}
.avatar-stack a:hover img {
    transform: translateY(-4px);
    z-index: 10;
    position: relative;
    border-color: var(--accent-cyan);
}
.footer-flex {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
}

@keyframes blink-cursor {
    50% { opacity: 0; }
}
</style>

<article class="post doc-page-wrapper">
  <div class="page-content">
    
    <p style="margin-bottom: 25px;">
        <a href="/docs/" class="back-link-hacker">
            << Back to Docs
        </a>
    </p>

    <header class="post-header">
      <h1 class="post-title doc-h1">{{ page.title }}<span style="color: var(--accent-cyan); animation: blink-cursor 1s step-end infinite;">_</span></h1>
    </header>

    <div class="post-content" style="margin-top: 30px;">
      {{ content }}
    </div>

    <div class="unified-card" style="margin-top: 60px;">
        <div class="unified-row interactive-row">
            <div class="footer-flex">
                <a href="https://github.com/PASSK3YS/PASSK3YS.github.io/edit/main/{{ page.path }}" target="_blank" class="unified-meta" style="display: flex; align-items: center; gap: 8px;">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.419-1.305.763-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                    Edit this page on GitHub
                </a>
                
                <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                    <span id="last-edited-time" class="soft-header">Loading history...</span>
                    <div id="contributors-avatars" class="avatar-stack"></div>
                </div>
            </div>
        </div>
    </div>

  </div>
</article>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const repo = "PASSK3YS/PASSK3YS.github.io";
    const path = "{{ page.path }}";
    
    fetch(`https://api.github.com/repos/${repo}/commits?path=${path}`)
        .then(res => res.json())
        .then(commits => {
            const timeEl = document.getElementById('last-edited-time');
            const avatarsEl = document.getElementById('contributors-avatars');
            
            if (commits && commits.length > 0) {
                const lastCommitDate = new Date(commits[0].commit.committer.date);
                timeEl.textContent = 'LAST EDITED: ' + lastCommitDate.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
                
                const authors = new Set();
                let avatarHtml = '';
                
                commits.forEach(c => {
                    if (c.author && !authors.has(c.author.login)) {
                        authors.add(c.author.login);
                        avatarHtml += `<a href="${c.author.html_url}" target="_blank" title="${c.author.login}"><img src="${c.author.avatar_url}&s=60" alt="${c.author.login}"></a>`;
                    }
                });
                
                avatarsEl.innerHTML = avatarHtml;
            } else {
                timeEl.textContent = 'LAST EDITED: UNKNOWN';
            }
        })
        .catch(() => {
            document.getElementById('last-edited-time').textContent = '';
        });
});
</script>
