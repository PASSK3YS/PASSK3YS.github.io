<style>
.page-header {
    text-align: center;
    margin-bottom: 30px;
}
.main-title {
    font-size: 2.5em;
    color: #222222;
    margin: 0 0 10px 0;
}
.year-subtitle {
    font-size: 1.8em;
    color: #555555;
    margin: 0;
    padding-bottom: 10px;
    border-bottom: 2px solid #dddddd;
    display: inline-block;
}
.search-container {
    text-align: center;
    margin-bottom: 40px;
}
#searchInput {
    padding: 12px 20px;
    width: 100%;
    max-width: 400px;
    font-size: 1em;
    border: 1px solid #cccccc;
    border-radius: 25px;
    outline: none;
    transition: border-color 0.2s;
}
#searchInput:focus {
    border-color: #222222;
}
.movie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 25px;
    max-width: 1200px;
    margin: 0 auto;
}
.movie-card {
    background-color: #ffffff;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    overflow: hidden;
    text-align: center;
    transition: transform 0.2s ease-in-out;
}
.movie-card:hover {
    transform: translateY(-5px);
}
.movie-thumbnail {
    width: 100%;
    height: 330px;
    object-fit: cover;
    background-color: #1a1a1a;
}
.movie-info {
    padding: 20px 15px;
}
.movie-title {
    font-size: 1.1em;
    font-weight: bold;
    margin: 0 0 8px 0;
    color: #222222;
    line-height: 1.3;
}
.movie-date {
    font-size: 0.9em;
    color: #777777;
    margin: 0;
}
</style>

<div class="page-header">
    <h1 class="main-title">Cinema Watchlist</h1>

</div>

<div class="search-container">

</div>

<script>
    const searchInput = document.getElementById('searchInput');
    const movieCards = document.querySelectorAll('.movie-card');

    searchInput.addEventListener('keyup', function() {
        const query = searchInput.value.toLowerCase();

        movieCards.forEach(card => {
            const title = card.querySelector('.movie-title').textContent.toLowerCase();
            if (title.includes(query)) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    });
</script>
