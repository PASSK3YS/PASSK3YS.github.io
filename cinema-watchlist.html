layout: default
title: Cinema Watchlist
permalink: /cinema-watchlist/
---

<style>
.page-header {
    text-align: center;
    margin-bottom: 30px;
}
.main-title {
    font-size: 2.5em;
    color: var(--text);
    margin: 0 0 10px 0;
}
.year-subtitle {
    font-size: 1.8em;
    color: var(--text-muted);
    margin: 0;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border);
    display: inline-block;
}
.search-container {
    text-align: center;
    margin-bottom: 40px;
}
#searchInput {
    padding: 12px 20px;
    width: 100%;
    max-width: 400px;
    font-size: 1em;
    background-color: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 25px;
    outline: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
}
#searchInput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
}
.movie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto;
}
.movie-card {
    display: flex;
    align-items: center;
    background-color: var(--nav-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
}
.movie-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    border-color: var(--accent);
}
.movie-thumbnail {
    width: 120px;
    height: 180px;
    object-fit: cover;
    background-color: var(--bg);
    flex-shrink: 0;
    border-right: 1px solid var(--border);
}
.movie-info {
    padding: 20px;
    display: flex;
    flex-direction: column;
}
.movie-title {
    font-size: 1.2em;
    font-weight: bold;
    margin: 0 0 8px 0;
    color: var(--text);
    line-height: 1.3;
}
.movie-date {
    font-size: 0.95em;
    color: var(--text-muted);
    margin: 0;
}
</style>

<div class="page-header">
    <h1 class="main-title">Cinema Watchlist</h1>
    <h2 class="year-subtitle">2026</h2>
</div>

<div class="search-container">
    <input type="text" id="searchInput" placeholder="Search my watched movies...">
</div>

<div class="movie-grid" id="movieGrid">
    <div class="movie-card">
        <img class="movie-thumbnail" src="https://walter-r2.trakt.tv/images/movies/000/531/178/posters/thumb/9224492cbf.jpg.webp" alt="Project Hail Mary">
        <div class="movie-info">
            <h2 class="movie-title">Project Hail Mary</h2>
            <p class="movie-date">19 Mar</p>
        </div>
    </div>
    <div class="movie-card">
        <img class="movie-thumbnail" src="https://walter.trakt.tv/images/movies/000/943/910/posters/thumb/8d89e50e93.jpg" alt="EPIC: Elvis Presley In Concert">
        <div class="movie-info">
            <h2 class="movie-title">EPIC: Elvis Presley In Concert</h2>
            <p class="movie-date">01 Mar</p>
        </div>
    </div>
    <div class="movie-card">
        <img class="movie-thumbnail" src="https://walter.trakt.tv/images/movies/000/815/508/posters/thumb/24f783267d.jpg" alt="Scream 7">
        <div class="movie-info">
            <h2 class="movie-title">Scream 7</h2>
            <p class="movie-date">28 Feb</p>
        </div>
    </div>
    <div class="movie-card">
        <img class="movie-thumbnail" src="https://walter.trakt.tv/images/movies/000/805/013/posters/thumb/43831853f6.jpg" alt="28 Years Later: The Bone Temple">
        <div class="movie-info">
            <h2 class="movie-title">28 Years Later: The Bone Temple</h2>
            <p class="movie-date">31 Jan</p>
        </div>
    </div>
    <div class="movie-card">
        <img class="movie-thumbnail" src="https://walter.trakt.tv/images/movies/000/775/848/posters/thumb/09c7890b3a.jpg" alt="Marty Supreme">
        <div class="movie-info">
            <h2 class="movie-title">Marty Supreme</h2>
            <p class="movie-date">02 Jan</p>
        </div>
    </div>
</div>

<script>
    const searchInput = document.getElementById('searchInput');
    const movieCards = document.querySelectorAll('.movie-card');

    searchInput.addEventListener('keyup', function() {
        const query = searchInput.value.toLowerCase();

        movieCards.forEach(card => {
            const title = card.querySelector('.movie-title').textContent.toLowerCase();
            if (title.includes(query)) {
                card.style.display = 'flex';
            } else {
                card.style.display = 'none';
            }
        });
    });
</script>
