<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinema Watchlist</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    margin: 0;
    padding: 40px 20px;
}
.page-header {
    text-align: center;
    margin-bottom: 40px;
}
.main-title {
    font-size: 2.5em;
    color: #222222;
    margin: 0 0 10px 0;
}
.year-subtitle {
    font-size: 1.8em;
    color: #555555;
    margin: 0;
    padding-bottom: 10px;
    border-bottom: 2px solid #dddddd;
    display: inline-block;
}
.movie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 25px;
    max-width: 1200px;
    margin: 0 auto;
}
.movie-card {
    background-color: #ffffff;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    overflow: hidden;
    text-align: center;
    transition: transform 0.2s ease-in-out;
}
.movie-card:hover {
    transform: translateY(-5px);
}
.movie-thumbnail {
    width: 100%;
    height: 330px;
    object-fit: cover;
    background-color: #1a1a1a;
}
.movie-info {
    padding: 20px 15px;
}
.movie-title {
    font-size: 1.1em;
    font-weight: bold;
    margin: 0 0 8px 0;
    color: #222222;
    line-height: 1.3;
}
.movie-date {
    font-size: 0.9em;
    color: #777777;
    margin: 0;
}
</style>
</head>
<body>

<div class="page-header">
    <h1 class="main-title">Cinema Watchlist</h1>
    <h2 class="year-subtitle">2026</h2>
</div>

<div class="movie-grid">
    <div class="movie-card">
        <img class="movie-thumbnail" src="https://en.wikipedia.org/wiki/Special:FilePath/Marty_Supreme_poster.jpg" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x450/1a1a1a/ffffff?text=Marty+Supreme';" alt="Marty Supreme">
        <div class="movie-info">
            <h2 class="movie-title">Marty Supreme</h2>
            <p class="movie-date">02 Jan</p>
        </div>
    </div>
    <div class="movie-card">
        <img class="movie-thumbnail" src="https://en.wikipedia.org/wiki/Special:FilePath/28_Years_Later_The_Bone_Temple_poster.jpg" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x450/1a1a1a/ffffff?text=28+Years+Later';" alt="28 Years Later: The Bone Temple">
        <div class="movie-info">
            <h2 class="movie-title">28 Years Later: The Bone Temple</h2>
            <p class="movie-date">31 Jan</p>
        </div>
    </div>
    <div class="movie-card">
        <img class="movie-thumbnail" src="https://en.wikipedia.org/wiki/Special:FilePath/Scream_7_(poster).jpg" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x450/1a1a1a/ffffff?text=Scream+7';" alt="Scream 7">
        <div class="movie-info">
            <h2 class="movie-title">Scream 7</h2>
            <p class="movie-date">28 Feb</p>
        </div>
    </div>
    <div class="movie-card">
        <img class="movie-thumbnail" src="https://en.wikipedia.org/wiki/Special:FilePath/EPIC_Elvis_Presley_In_Concert_poster.jpg" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x450/1a1a1a/ffffff?text=EPIC';" alt="EPIC: Elvis Presley In Concert">
        <div class="movie-info">
            <h2 class="movie-title">EPIC: Elvis Presley In Concert</h2>
            <p class="movie-date">01 Mar</p>
        </div>
    </div>
    <div class="movie-card">
        <img class="movie-thumbnail" src="https://en.wikipedia.org/wiki/Special:FilePath/Project_Hail_Mary_poster.jpg" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x450/1a1a1a/ffffff?text=Project+Hail+Mary';" alt="Project Hail Mary">
        <div class="movie-info">
            <h2 class="movie-title">Project Hail Mary</h2>
            <p class="movie-date">19 Mar</p>
        </div>
    </div>
</div>

</body>
</html>
