---
layout: default
title: Blog
permalink: /blog/
---

<div class="page-content">
  <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
    <h1 style="margin: 0;">Blog</h1>
    <a href="/feed.json" target="_blank" title="Subscribe via RSS" style="color: inherit; opacity: 0.5; display: inline-flex; transition: opacity 0.2s ease;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.5'">
      <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 11a9 9 0 0 1 9 9"></path>
        <path d="M4 4a16 16 0 0 1 16 16"></path>
        <circle cx="5" cy="19" r="1"></circle>
      </svg>
    </a>
  </div>
  <p style="margin-top: 0;">Welcome to my blog.</p>

  <div class="post-list" style="margin-top: 40px; display: grid; gap: 20px;">
    
    {% for post in site.posts %}
    <div style="border: 1px solid var(--border); padding: 20px; border-radius: 8px; background: var(--nav-bg);">
      
      <div style="font-size: 0.85rem; opacity: 0.6; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;">
        {{ post.date | date: "%B %-d, %Y" }}
      </div>

      <h2 style="margin-top: 0;">
        <a href="{{ post.url }}" style="text-decoration: none; color: inherit;">{{ post.title }}</a>
      </h2>

      <p>{{ post.description | default: post.excerpt | strip_html | truncatewords: 30 }}</p>

      <a href="{{ post.url }}" style="font-weight: bold; color: var(--accent);">Read more &rarr;</a>
    </div>
    {% endfor %}

  </div>
</div>
