---
layout: default
title: Blog
permalink: /blog/
---

<div class="bio-container">
    <div class="bio-text">
        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 10px;">
            <h1 style="margin: 0; font-size: 2.2rem; font-weight: 800; letter-spacing: -1px;">
                Blog<span class="blinking-cursor">_</span>
            </h1>
            <a href="/feed.json" target="_blank" title="Subscribe via RSS" class="rss-link">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 11a9 9 0 0 1 9 9"></path>
                    <path d="M4 4a16 16 0 0 1 16 16"></path>
                    <circle cx="5" cy="19" r="1"></circle>
                </svg>
            </a>
        </div>
        <p style="font-size: 1.05rem; opacity: 0.9; margin: 0;">
            Welcome to my blog.
        </p>
    </div>
</div>

<div class="unified-card">
    
    {% for post in site.posts %}
    <a href="{{ post.url }}" class="unified-row interactive-row">
        <div>
            <span class="unified-meta">{{ post.date | date: "%B %-d, %Y" }}</span>
        </div>
        
        <div style="display: flex; flex-direction: column; justify-content: center;">
            <h2 class="directory-interactive-text" style="margin: 0 0 10px 0;">{{ post.title }}</h2>
            <p style="font-size: 0.95rem; color: var(--text-muted); margin: 0; line-height: 1.5;">
                {{ post.description | default: post.excerpt | strip_html | truncatewords: 30 }}
            </p>
            <span class="read-more">Read more &rarr;</span>
        </div>
    </a>
    {% endfor %}

</div>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">

<style>
body, main, p, a, span, div {
    font-family: 'SUSE', sans-serif !important;
}
h1, h2, h3 {
    font-family: 'Staatliches', cursive !important;
}

.blinking-cursor {
    font-weight: 800;
    color: var(--accent-cyan);
    animation: blink 1s step-end infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

.bio-container {
    display: flex;
    align-items: center;
    gap: 30px;
    margin-bottom: 40px;
}

.bio-text {
    display: flex;
    flex-direction: column;
}

.rss-link {
    color: inherit;
    opacity: 0.4;
    display: inline-flex;
    transition: opacity 0.1s ease, color 0.1s ease;
}

.rss-link:hover {
    opacity: 1;
    color: var(--accent-cyan);
}

.unified-card {
    background: var(--nav-bg);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border-color);
    box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.1);
    overflow: hidden;
}

[data-theme="dark"] .unified-card {
    border: 1px solid var(--border-color);
    box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.3);
}

.unified-row {
    padding: 30px 34px;
    border-bottom: 1px dashed var(--border-color);
    display: grid;
    grid-template-columns: 240px 1fr;
    align-items: start;
    transition: background-color 0.1s ease, border-color 0.1s ease;
    border-left: 6px solid transparent;
    text-decoration: none;
    color: inherit;
}

.unified-row:last-child {
    border-bottom: none;
}

.unified-row.interactive-row {
    cursor: pointer;
}

.unified-row.interactive-row:hover {
    background-color: rgba(42, 161, 152, 0.05);
    border-left-color: var(--accent-cyan);
}

[data-theme="dark"] .unified-row.interactive-row:hover {
    background-color: rgba(42, 161, 152, 0.1);
    border-left-color: var(--accent-cyan);
}

.interactive-row:hover .directory-interactive-text {
    color: var(--accent-cyan);
}

.interactive-row:hover .read-more {
    color: var(--accent-cyan);
    transform: translateX(5px);
}

.unified-meta {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin: 0;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 1px;
    transition: color 0.1s ease;
}

.interactive-row:hover .unified-meta {
    color: var(--accent-cyan);
}

.directory-interactive-text {
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--text);
    text-decoration: none;
    transition: color 0.1s ease;
    line-height: 1.3;
}

.read-more {
    display: inline-block;
    margin-top: 15px;
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: color 0.1s ease, transform 0.1s ease;
}

@media (max-width: 850px) {
    .unified-row {
        grid-template-columns: 1fr;
        gap: 15px;
        padding: 25px 14px;
    }
    .unified-meta {
        margin-bottom: 5px;
        display: inline-block;
    }
}
</style>
