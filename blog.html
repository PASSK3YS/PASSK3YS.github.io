---
layout: default
title: Blog
permalink: /blog/
---

<div class="section-cmd tline" style="margin-top: 0;">
    <div class="prompt-line" style="align-items: center;">
        <span class="prompt">$</span><span class="cmd"><span class="command-name">blog</span> --posts</span>
        <a href="/feed.json" target="_blank" title="Subscribe via RSS" class="rss-link">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 11a9 9 0 0 1 9 9"></path>
                <path d="M4 4a16 16 0 0 1 16 16"></path>
                <circle cx="5" cy="19" r="1"></circle>
            </svg>
        </a>
    </div>
    <p class="dim" style="margin: 2px 0 0 0;">Welcome to my blog.</p>
</div>

{% for post in site.posts %}
<a href="{{ post.url }}" class="post-tr tline">
    <span class="tr-k">[{{ post.date | date: "%d.%m.%y" }}]</span>
    <span class="post-main">
        <span class="post-title">{{ post.title }}</span>
        <span class="post-desc dim">{{ post.description | default: post.excerpt | strip_html | truncatewords: 30 }}</span>
        <span class="read-more">Read more &rarr;</span>
    </span>
</a>
{% endfor %}

<div class="section-cmd tline">
    <div class="prompt-line" style="margin-top: 22px;">
        <span class="prompt">$</span><span class="term-cursor"></span>
    </div>
</div>

<style>
    /* Blog page — terminal styling (shared with homepage) */
    .prompt-line { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; }
    .prompt { color: var(--accent); white-space: nowrap; font-family: 'JetBrains Mono', monospace; }
    .cmd { color: var(--text); font-family: 'JetBrains Mono', monospace; }
    .command-name { color: var(--accent); }

    .dim { color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

    .rss-link {
        color: var(--text-muted);
        display: inline-flex;
        align-self: center;
        transition: color 0.2s ease, text-shadow 0.2s ease;
    }
    .rss-link:hover { color: var(--accent); text-shadow: 0 0 12px var(--accent-glow); }

    .post-tr {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        padding: 5px 0;
        margin-top: 14px;
        width: fit-content;
        max-width: 100%;
        text-decoration: none;
        transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        font-family: 'JetBrains Mono', monospace;
    }
    .post-tr:hover { transform: translateX(8px); }
    .post-tr .tr-k { color: var(--accent); opacity: 0.75; transition: opacity 0.25s ease; white-space: nowrap; }
    .post-tr:hover .tr-k { opacity: 1; }

    .post-main { display: flex; flex-direction: column; min-width: 0; }
    .post-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 1rem;
        color: var(--text);
        transition: color 0.2s ease;
    }
    .post-tr:hover .post-title { color: var(--accent); }
    .post-desc {
        font-size: 0.82rem;
        line-height: 1.5;
        margin-top: 2px;
    }
    .read-more {
        display: inline-block;
        margin-top: 8px;
        font-size: 0.7rem;
        color: var(--text-muted);
        letter-spacing: 1px;
        text-transform: uppercase;
        transition: color 0.25s ease, transform 0.25s ease;
    }
    .post-tr:hover .read-more {
        color: var(--accent);
        transform: translateX(4px);
    }

    .term-cursor {
        display: inline-block;
        width: 0.55em; height: 1.05em;
        background: var(--accent);
        vertical-align: text-bottom;
        animation: blog-blink 1s step-end infinite;
    }
    @keyframes blog-blink { 50% { opacity: 0; } }

    .tline { opacity: 0; animation: blog-type-in 0.4s ease forwards; }
    @keyframes blog-type-in { to { opacity: 1; } }
</style>
