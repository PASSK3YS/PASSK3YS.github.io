---
layout: default
title: Blog
permalink: /blog/
---

<h2>Entries</h2>
<hr>

{% for post in site.posts %}
    <div class="blog-post">
        <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
        <div class="meta">{{ post.date | date: "%B %-d, %Y" }}</div>
        <p class="excerpt">{{ post.description }}</p>
        <a href="{{ post.url }}">Read more →</a>
    </div>
{% endfor %}
